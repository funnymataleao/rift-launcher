name: Rift build

# Builds the public, clean APK: GameNative's proprietary blobs are not in this
# repository and are not fetched here, so the artifact is safe to publish.
# Games need those blobs to start on Android 15+; private test builds add them
# locally with tools/rift/fetch-proprietary-blobs.sh.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: rift-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Check that no proprietary blobs are committed
        run: |
          found=0
          while read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error file=$path::GameNative proprietary blob must not be committed"
              found=1
            fi
          done < tools/rift/proprietary-blobs.txt
          if git ls-files | grep -E 'libredirect[^/]*\.so$|libkgslshim\.so$|libsteambootstrap\.so$'; then
            found=1
          fi
          exit $found

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The secrets Gradle plugin needs local.properties to exist, and turns every
      # entry into a raw BuildConfig field, so it must not hold empty secrets.
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build modern debug APK
        run: ./gradlew :app:assembleModernDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rift-launcher-modern-debug-clean
          path: app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
          retention-days: 14
